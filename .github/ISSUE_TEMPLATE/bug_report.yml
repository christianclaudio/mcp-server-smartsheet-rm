name: "🐛 Bug Report"
description: "File a bug report for mcp-server-smartsheet-rm"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        ⚠️ **Security Notice:** Do NOT include API tokens, Authorization headers, passwords, or other sensitive credentials in this issue.
  - type: input
    id: version
    attributes:
      label: Server Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug encountered.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
