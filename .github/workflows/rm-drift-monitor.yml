name: Smartsheet RM API Drift Monitor

on:
  schedule:
    # Run every Sunday at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# One drift check at a time; a manual run waits for a scheduled one instead of racing it.
# queue: max lets up to 100 runs wait instead of cancelling them (GitHub does not
# guarantee their order).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  drift-check:
    name: Check Smartsheet RM OpenAPI Drift
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout
      issues: write   # open the drift issue when the check fails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade "pip>=26.2.2"
          pip install -e ".[dev]"
      - name: Run OpenAPI drift check
        id: drift
        env:
          SPEC_URL: "https://developers.smartsheet.com/_spec/api/resource_management/openapi.json"
        # Exit 1 is drift (open an issue below). Any other non-zero code (2: spec unreadable,
        # a client-surface failure, an unparseable source file, no client calls found or an
        # unexpected error) fails the job without a drift issue.
        run: |
          set +e
          python scripts/check_openapi_drift.py --spec-url "$SPEC_URL"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error title=Drift check failed::check_openapi_drift.py exited $rc, which is not drift; no issue was opened."
            exit "$rc"
          fi
      - name: Open Issue on Drift
        if: steps.drift.outputs.rc == '1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const title = "⚠️ Smartsheet RM OpenAPI Drift Detected";
            // Duplicate check uses the same forge-todo label the issue is created with.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "forge-todo",
              per_page: 100
            });
            const duplicate = open.find(i => !i.pull_request && i.title === title);
            if (!duplicate) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: "The weekly OpenAPI drift monitor detected differences against the published Smartsheet Resource Management specification. Please review recent API changes.",
                labels: ["forge-todo"]
              });
            }
