name: Smartsheet RM API Drift Monitor

on:
  schedule:
    # Run every Sunday at 04:00 UTC (12:00 AM EDT)
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    name: Check Smartsheet RM OpenAPI Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run OpenAPI drift check
        id: drift
        continue-on-error: true
        run: python scripts/check_openapi_drift.py
      - name: Open Issue on Drift
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const title = "⚠️ Smartsheet RM OpenAPI Drift Detected";
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "drift"
            });
            const duplicate = existingIssues.data.find(i => i.title === title);
            if (!duplicate) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: "The daily OpenAPI drift monitor detected differences against the published Smartsheet Resource Management specification. Please review recent API changes.",
                labels: ["drift", "maintenance"]
              });
            }
