name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merges made by dependabot-automerge.yml use GITHUB_TOKEN, and pushes made
  # with GITHUB_TOKEN don't trigger push workflows, so the push trigger above
  # misses them. The weekly run tests main itself on Sunday afternoon Eastern,
  # after the Sunday morning Dependabot run (.github/dependabot.yml), and is the
  # only scheduled run of the drift-check job (manual dispatch also runs it);
  # schedule runs only on the default branch.
  # timezone keeps it at 14:41 Eastern through daylight saving changes. The minute
  # is off the hour to avoid peak scheduler load.
  schedule:
    - cron: '41 14 * * 0'
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  # Each push to main gets its own group, keyed on the commit SHA, so runs for
  # different main commits never wait behind, replace or cancel each other.
  # Pull request runs share one group per PR ref, and a new push to the PR cancels
  # the run in progress.
  # Scheduled and workflow_dispatch runs on main share the CI-refs/heads/main
  # group and never cancel a run in progress; only the newest pending run waits,
  # and older pending runs are dropped.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy strict
        run: uv run mypy --strict src/

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra code-mode --python "$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
      - name: Unit and integration tests (100% statement coverage)
        run: uv run pytest --cov=src/smartsheet_rm_mcp --cov-report=term-missing --cov-fail-under=100 -v

  contract:
    name: Tool contract and safety gating
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Assert tool counts and safety gating
        run: uv run python scripts/check_tool_contract.py

  openapi-drift:
    name: OpenAPI drift validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Check client endpoints against published RM OpenAPI spec
        # Smartsheet's published spec, linked from
        # https://developers.smartsheet.com/api/resource_management/openapi
        run: uv run python scripts/check_openapi_drift.py --spec-url "https://developers.smartsheet.com/_spec/api/resource_management/openapi.json"

  build:
    name: Build and package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Build sdist and wheel
        run: uv run python -m build
      - name: Reject fallback and untagged versions
        run: uv run python scripts/check_version.py
      - name: Twine check
        run: uv run twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14

  protocol:
    name: Protocol & stdio verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Protocol & stdio verification
        run: uv run pytest tests/test_protocol.py --no-cov
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Protocol conformance suite
        run: ./scripts/check_conformance.sh

  docker-build:
    name: Container builder floor check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mcp-server-ci:test

      - name: Image label matches server.json name
        run: |
          EXPECTED="$(jq -r .name server.json)"
          ACTUAL="$(docker inspect --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' mcp-server-ci:test)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::image label '${ACTUAL}' does not match server.json name '${EXPECTED}'"
            exit 1
          fi
          echo "Image label matches ${EXPECTED}"

      - name: Runtime image has the project and no build backend
        # The builder installs the build backend to /tmp/build-backend, outside the venv the
        # runtime stage copies. These are build-only packages, and this repo's lock has none of
        # them at runtime.
        run: |
          PROJECT="$(grep -m 1 '^name = ' pyproject.toml | cut -d '"' -f 2)"
          docker run --rm --entrypoint pip mcp-server-ci:test show "$PROJECT" > /dev/null
          for pkg in hatchling uv-dynamic-versioning dunamai trove-classifiers tomlkit jinja2 \
            MarkupSafe pathspec pluggy; do
            if docker run --rm --entrypoint pip mcp-server-ci:test show "$pkg" > /dev/null 2>&1; then
              echo "::error::build backend package $pkg is in the runtime image"
              exit 1
            fi
          done
          echo "Runtime image has $PROJECT and no build backend"

      - name: Image serves MCP over stdio
        # Starts the runtime image on its default stdio transport with no network, sends
        # initialize, notifications/initialized and tools/list, and holds stdin open until
        # the tools/list reply arrives so the check does not depend on shutdown-on-EOF timing.
        # Replies are matched by JSON-RPC id, not by line order, and every non-empty stdout line
        # must parse as exactly one JSON-RPC 2.0 message (stdio is newline-delimited).
        run: |
          set -euo pipefail
          IN="$RUNNER_TEMP/mcp-in"
          OUT="$RUNNER_TEMP/mcp-out"
          mkfifo "$IN"
          : > "$OUT"
          timeout --kill-after=5 60 docker run -i --rm --network none mcp-server-ci:test < "$IN" > "$OUT" &
          SERVER=$!
          exec 3> "$IN"
          MESSAGES='split("\n") | map(select(length > 0) | fromjson | if type == "object" and .jsonrpc == "2.0" then . else error("stdout line is not a JSON-RPC 2.0 message") end)'
          wait_for_id() {
            for _ in $(seq 1 150); do
              if jq -Rse --argjson id "$1" "$MESSAGES | any(.[]; .id == \$id)" "$OUT" > /dev/null 2>&1; then
                return 0
              fi
              sleep 0.2
            done
            echo "No reply with id $1 within 30s"; cat "$OUT"; exit 1
          }
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' >&3
          wait_for_id 1
          printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}' >&3
          printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' >&3
          wait_for_id 2
          exec 3>&-
          wait "$SERVER"
          jq -Rse "$MESSAGES"' | map(select(.id == 1)) | length == 1 and .[0].result.protocolVersion == "2025-11-25"' "$OUT"
          jq -Rse "$MESSAGES"' | map(select(.id == 2)) | length == 1 and (.[0].result.tools | type == "array" and length > 0)' "$OUT"
          echo "Image answered initialize and tools/list over stdio"

      - name: Builder fails below the ca-certificates floor
        # Raising CA_CERTIFICATES_FLOOR above any real Debian version makes the installed
        # package older than the floor, whatever version the base image or trixie-security
        # ships, so this is deterministic. The build must fail at the builder's floor check,
        # with its message, and before the pip bootstrap step starts.
        run: |
          set +e
          docker build --target builder --progress=plain \
            --build-arg CA_CERTIFICATES_FLOOR=99991231 . > ca-floor.log 2>&1
          status=$?
          set -e
          cat ca-floor.log
          if [ "$status" -eq 0 ]; then
            echo "::error::builder built with a ca-certificates floor above the installed version"
            exit 1
          fi
          if ! grep -q "is older than the floor 99991231" ca-floor.log; then
            echo "::error::builder failed, but not at the ca-certificates floor check"
            exit 1
          fi
          if grep -q -- "--require-hashes" ca-floor.log; then
            echo "::error::the pip bootstrap step started before the ca-certificates floor check failed"
            exit 1
          fi
          echo "Builder stops at the ca-certificates floor check before any pip step"

  drift-check:
    name: Check Smartsheet RM OpenAPI Drift
    # Scheduled and manual runs only; pushes and pull requests skip it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout
      issues: write   # open the drift issue on main when the scan finds drift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade "pip>=26.2.2"
          pip install -e ".[dev]"
      - name: Run OpenAPI drift check
        id: drift
        env:
          SPEC_URL: "https://developers.smartsheet.com/_spec/api/resource_management/openapi.json"
        # Exit 1 is drift (on main, open an issue below). Any other non-zero code (2: spec unreadable,
        # a client-surface failure, an unparseable source file, no client calls found or an
        # unexpected error) fails the job without a drift issue.
        run: |
          set +e
          python scripts/check_openapi_drift.py --spec-url "$SPEC_URL"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error title=Drift check failed::check_openapi_drift.py exited $rc, which is not drift; no issue was opened."
            exit "$rc"
          fi
      - name: Open Issue on Drift
        if: steps.drift.outputs.rc == '1' && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const title = "⚠️ Smartsheet RM OpenAPI Drift Detected";
            // Duplicate check uses the same forge-todo label the issue is created with.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "forge-todo",
              per_page: 100
            });
            const duplicate = open.find(i => !i.pull_request && i.title === title);
            if (!duplicate) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: "The weekly OpenAPI drift monitor detected differences against the published Smartsheet Resource Management specification. Please review recent API changes.",
                labels: ["forge-todo"]
              });
            }
